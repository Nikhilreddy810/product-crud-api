server:
  port: 8080

spring:
  application:
    name: product-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:productdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-it-before-prod-0000}
  access-token-expiration-ms: ${JWT_ACCESS_EXP:900000}       # 15 min
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}  # 7 days

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  seed:
    admin-username: ${SEED_ADMIN_USER:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
    user-username: ${SEED_USER_USER:user}
    user-password: ${SEED_USER_PASSWORD:user123}
